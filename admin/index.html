
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Oriel JCR Tuck Shop Admin</title>
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
  <link rel="icon" href="admin-icon.ico">
</head>
<body>

  <h1>Oriel JCR Tuck Shop Admin</h1>

  <section>
    <h2>GitHub Connection</h2>
    <p>Enter your GitHub personal access token.</p>
    <input type="password" id="token"
           placeholder="GitHub token"
           autocomplete="off">
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
    <p id="message" role="status"></p>
  </section>

  <div id="editor" hidden>
    <section>
      <h2>Products</h2>
      <div id="items-list"></div>

      <h3>Add / Edit Product</h3>
      <form id="item-form">
        <input id="name" placeholder="Product name" required>
        <input id="price" type="number" min="0"
               step="0.01" placeholder="Price" required>
        <div class="image-manager">
            <label for="image">Product image path</label>
            <input id="image" placeholder="images/example.jpg">

            <div>
                <label for="image-file">Choose an image</label>
                <input
                type="file"
                id="image-file"
                accept="image/png,image/jpeg,image/webp,image/gif"
                >
            </div>

            <div>
                <label for="image-filename">Filename</label>
                <input
                id="image-filename"
                placeholder="example.jpg"
                >
            </div>

            <button type="button" id="upload-image">
                Upload Image to GitHub
            </button>

            <button type="button" id="rename-image">Rename Existing Image</button>

            <p id="image-message" role="status"></p>
        </div>
        <label>
          <input id="available" type="checkbox" checked>
          Available
        </label>
        <p>
          <button type="submit">Save Product</button>
          <button type="button" id="clear-item">Clear</button>
        </p>
      </form>

      <button id="save-items">Publish Products to GitHub</button>
    </section>

    <section>
      <h2>Opening Hours</h2>
      <div id="hours-list"></div>
      <button id="save-hours">Publish Hours to GitHub</button>
    </section>
  </div>

</body>
</html>
